<title>بازی‌های آموزشی فارسی</title>

:root[data-theme=dark]{--bg:#1e1b2e;--card:#2a2640;--ink:#f3f4f6;--gr:#166534}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.7}

.sun{position:absolute;top:8px;inset-inline-start:16px;font-size:2.2rem}

main{max-width:640px;margin:0 auto;padding:12px}

button:active{transform:scale(0.96);box-shadow:0 1px 0 rgba(0,0,0,0.1)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #f472b6}
.opts button{width:100%;margin:8px 0;font-size:1.25rem;background:#fdf4ff;color:var(--ink);border:3px solid #d8b4fe}

.opts .no{background:#fee2e2;color:#991b1b;border-color:#f87171}

.lab{text-align:center;margin:0;font-weight:700;color:#64748b}
.tag{font-size:.8rem;background:#fef08a;color:#854d0e;border-radius:12px;padding:3px 10px;font-weight:700}

.mc{font-size:1.05rem;min-height:80px;border-radius:20px;background:linear-gradient(135deg,#c084fc,#818cf8);color:#fff}

.hero .sn{position:absolute;top:10px;inset-inline-start:16px;font-size:2.6rem}
.hero .mas{position:absolute;bottom:6px;inset-inline-start:50%;margin-inline-start:-34px;font-size:4.2rem;line-height:1}

.lg>button{font-size:1.3rem;background:#ec4899;margin-top:8px}
.pbtn{flex:1;position:relative;overflow:hidden;text-align:center;cursor:pointer;background:#a855f7;color:#fff;border-radius:22px;padding:12px;font-weight:700}
.pbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.bx{background:var(--card);border-radius:30px;padding:20px;max-width:420px;width:100%;border:4px solid #fbcfe8}
.ts{position:fixed;bottom:20px;inset-inline:20px;margin:auto;max-width:400px;background:#db2777;color:#fff;border-radius:20px;padding:12px 20px;text-align:center;z-index:60;font-weight:700;box-shadow:0 10px 25px rgba(219,39,119,0.3)}
details{margin:8px 0;background:#fdf4ff;border-radius:20px;padding:10px 14px;border:2px solid #f3e8ff}summary{cursor:pointer;font-weight:700;color:#9333ea}
